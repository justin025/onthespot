[project]
name = "ots-companion"
version = "0.1.0"
description = "spotify Companion for ots"
readme = "README.md"
authors = [
    { name = "moddroid94", email = "samuel.brizzi94@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "requests>=2.34.2",
    "librespot",
]

[tool.uv.sources]
librespot = { git = "https://github.com/ots-downloader/librespot-python.git" }

[project.scripts]
companion = "companion:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
